<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci pour ta commande 🌸 Amoria Glow</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Segoe UI', Arial, sans-serif;
    background:linear-gradient(160deg,#FFF0F7 0%,#FFE4EF 100%);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .card {
    background:#fff;
    border-radius:24px;
    box-shadow:0 20px 60px rgba(255,121,179,.25);
    max-width:440px; width:100%;
    padding:44px 32px;
    text-align:center;
  }
  .check {
    width:90px; height:90px;
    margin:0 auto 24px;
    background:linear-gradient(135deg,#FF79B3,#FF9EC7);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:46px; color:#fff;
    box-shadow:0 8px 24px rgba(255,121,179,.4);
  }
  h1 { font-size:26px; color:#C0306A; margin-bottom:12px; }
  p  { font-size:15px; color:#7A3050; line-height:1.6; margin-bottom:10px; }
  .sub { font-size:13px; color:#B07090; margin-top:18px; }
  .btn {
    display:inline-block;
    margin-top:26px;
    background:linear-gradient(135deg,#FF79B3,#FF9EC7);
    color:#fff; text-decoration:none;
    padding:14px 30px; border-radius:50px;
    font-weight:700; font-size:15px;
    box-shadow:0 6px 18px rgba(255,121,179,.4);
  }
  .logo { font-size:20px; font-weight:800; color:#FF79B3; margin-bottom:28px; letter-spacing:.05em; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">✨ AMORIA GLOW ✨</div>
    <div class="check">✓</div>
    <h1>Merci pour ta commande&nbsp;🌸</h1>
    <p>Ton paiement a bien été reçu&nbsp;!</p>
    <p>On prépare ta commande avec amour et on t'envoie un mail de confirmation très vite. 💕</p>
    <p class="sub">Un souci ? Écris-nous en répondant à ton mail de confirmation.</p>
    <a class="btn" href="https://amoria-glow-shop.netlify.app/index.html">Retour à la boutique</a>
  </div>
</body>
</html>
